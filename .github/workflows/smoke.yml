name: Smoke test

# Run by hand (Actions → Smoke test → Run workflow): installs the app on an Android emulator,
# logs in to a throwaway Navidrome with generated songs, clicks through the main screens and
# checks that nothing was ever deleted on the server. Screenshots go to a draft release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }}

      - name: Start Navidrome with sample music
        run: bash .github/smoke/navidrome.sh

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free memory for the emulator and watch the machine
        run: |
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          mkdir -p smoke-out
          free -m | tee smoke-out/host-start.txt
          # Every 10 seconds: memory, load and the emulator's own memory, so a crash leaves a trail.
          nohup bash -c 'while true; do
            echo "$(date +%T) $(free -m | awk "/Mem:/{print \"used=\" \$3 \" avail=\" \$7}") swap=$(free -m | awk "/Swap:/{print \$3}") load=$(cut -d" " -f1-3 /proc/loadavg) emu_rss_mb=$(( $(ps -o rss= -p "$(pgrep qemu-system | head -1)" 2>/dev/null || echo 0) / 1024 )) disk_avail=$(df -BM --output=avail / | tail -1)"
            sleep 10
          done' > smoke-out/host.txt 2>&1 &

      - name: Click through the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/smoke/drive.py

      - name: Machine clues (memory kills, emulator crash reports)
        if: always()
        run: |
          mkdir -p smoke-out
          sudo dmesg -T 2>/dev/null | grep -iE "oom|killed|qemu|segfault|out of memory" | tail -40 > smoke-out/host-dmesg.txt || true
          free -m >> smoke-out/host-dmesg.txt
          ls -laR /tmp/android-runner 2>/dev/null | head -60 > smoke-out/host-crash-files.txt || true
          if [ -d /tmp/android-runner ]; then tar czf smoke-out/emu-crash.tgz -C /tmp android-runner 2>/dev/null || true; fi
          tail -5 smoke-out/host.txt || true
          cat smoke-out/host-dmesg.txt

      - name: Check the server never received a delete
        if: always()
        run: |
          mkdir -p smoke-out
          docker logs navidrome > smoke-out/navidrome.log 2>&1 || true
          if grep -Ei 'deletePlaylist|deleteShare|deleteUser|songIndexToRemove' smoke-out/navidrome.log; then
            echo "FAIL  server received a delete request" | tee -a smoke-out/results.txt
            exit 1
          fi
          echo "PASS  no delete requests in the Navidrome log" | tee -a smoke-out/results.txt

      - name: Keep results as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-out
          retention-days: 7

      - name: Upload results to a draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find smoke-out -type f -empty -delete
          # Keep only the newest results: remove earlier smoke-test drafts.
          gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft and (.tagName | startswith("smoke-"))) | .tagName' \
            | while read -r t; do gh release delete "$t" --yes || true; done
          gh release create "smoke-${{ github.run_number }}" smoke-out/* \
            --draft --title "Smoke test ${{ github.run_number }}" --notes "$(cat smoke-out/results.txt 2>/dev/null || echo 'no results')"
